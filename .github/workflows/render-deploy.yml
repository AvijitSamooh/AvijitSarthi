name: Deploy Render Backend (Manual)

on:
  workflow_dispatch:
    inputs:
      commit_id:
        description: Optional full commit SHA to deploy; leave blank for Render's latest configured branch commit
        required: false
        type: string
      clear_cache:
        description: Clear Render build cache
        required: true
        type: choice
        default: do_not_clear
        options:
          - do_not_clear
          - clear

permissions:
  contents: read

concurrency:
  group: render-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Request Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deployment configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          COMMIT_ID: ${{ inputs.commit_id }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::Missing Actions secret RENDER_API_KEY."; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "::error::Missing Actions variable RENDER_SERVICE_ID."; exit 1; }
          if [ -n "$COMMIT_ID" ] && ! [[ "$COMMIT_ID" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_id must be a full 40-character Git commit SHA or blank."
            exit 1
          fi
          echo "Render deployment configuration validated."

      - name: Verify Render service belongs to this repository
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! SERVICE_JSON=$(curl --fail-with-body --silent --show-error --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" --header "Authorization: Bearer $RENDER_API_KEY" --header "Accept: application/json"); then
            echo "::error::Render service $RENDER_SERVICE_ID could not be found or accessed. Set RENDER_SERVICE_ID to the Avijit Sarthi web service before deploying. No deployment was requested."
            exit 1
          fi
          SERVICE_REPO=$(jq -r '.repo // empty' <<< "$SERVICE_JSON" | sed -E 's#\.git$##; s#/$##' | tr '[:upper:]' '[:lower:]')
          EXPECTED_REPO=$(printf 'https://github.com/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          SERVICE_BRANCH=$(jq -r '.branch // empty' <<< "$SERVICE_JSON")
          SERVICE_TYPE=$(jq -r '.type // empty' <<< "$SERVICE_JSON")
          if [ "$SERVICE_REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Render service $RENDER_SERVICE_ID is connected to an unexpected repository. Expected $EXPECTED_REPO; no deployment was requested."
            exit 1
          fi
          if [ "$SERVICE_BRANCH" != "master" ] || [ "$SERVICE_TYPE" != "web_service" ]; then
            echo "::error::Render service $RENDER_SERVICE_ID must be a master-branch web service (found branch: ${SERVICE_BRANCH:-missing}, type: ${SERVICE_TYPE:-missing}). No deployment was requested."
            exit 1
          fi
          echo "Render service target verified for $GITHUB_REPOSITORY on master."

      - name: Request deployment on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          COMMIT_ID: ${{ inputs.commit_id }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/render-deploy-payload.json
          import json, os
          payload = {"clearCache": os.environ["CLEAR_CACHE"]}
          if os.environ.get("COMMIT_ID", "").strip():
              payload["commitId"] = os.environ["COMMIT_ID"].strip()
          print(json.dumps(payload))
          PY
          echo "Requesting deployment for Render service $RENDER_SERVICE_ID."
          # Deliberately do not automatically retry this POST: if the server accepts a
          # deploy but the response is lost, a blind retry can create a duplicate deploy.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/render-deploy-payload.json \
            --output /tmp/render-deploy-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path("/tmp/render-deploy-response.json").read_text())
          if isinstance(response, dict):
              deploy = response.get("deploy", response)
              print("Render accepted deployment request.")
              for key in ("id", "status", "commit", "createdAt"):
                  value = deploy.get(key) if isinstance(deploy, dict) else None
                  if value is not None:
                      print(f"{key}: {value}")
          else:
              print("Render accepted deployment request.")
          PY
