name: CI
on:
  workflow_dispatch:
  # Validate feature branches through PRs, and validate master after merge.
  # Do not run on every feature-branch push as that duplicates pull_request CI.
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  release_contract:
    name: Android release workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate manual release contract
        run: node .github/scripts/validate-release-contract.mjs

  backend:
    name: Backend - NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json


      - name: Install dependencies
        run: npm ci

      - name: Build

        run: npm run build

      - name: Unit tests with coverage thresholds
        run: npm run test:cov -- --runInBand

      - name: Application dependency-injection smoke test
        run: npm run test:e2e -- --runInBand

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/nestjs/coverage

  flutter:
    name: Flutter - Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Tests with coverage
        run: flutter test --coverage

      - name: Install Linux integration-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Integration tests
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: app/flutter/coverage

