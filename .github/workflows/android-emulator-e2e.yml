name: Android Emulator E2E - Avijit Sarthi

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - "app/flutter/**"
      - "backend/nestjs/**"
      - ".github/workflows/android-emulator-e2e.yml"
  push:
    branches:
      - master
    paths:
      - "app/flutter/**"
      - "backend/nestjs/**"
      - ".github/workflows/android-emulator-e2e.yml"
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: android-emulator-e2e-avijit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Install, launch and test Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js for Firebase Auth and Firestore Emulators
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install and build isolated NestJS E2E API
        working-directory: backend/nestjs
        run: |
          npm ci
          npm run build

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Configure and validate Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing required repository variable GOOGLE_SERVICES_JSON."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          jq empty android/app/google-services.json
          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[0].client_info.android_client_info.package_name // empty' android/app/google-services.json)
          test "$PROJECT_ID" = "avijitsahyog-firebase"
          test "$PACKAGE_NAME" = "com.avijitsamooh.avijitsahyog"

      - name: Build debug APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          flutter build apk --debug \
            --dart-define=E2E_TEST_MODE=true \
            --dart-define=API_BASE_URL=http://10.0.2.2:3000 2>&1 | tee artifacts/apk-build.log
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Configure Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM hardware acceleration is available."
          else
            echo "::warning::KVM is not accessible to this runner; using TCG software emulation with an Android system-service readiness check."
            id
            ls -l /dev/kvm || true
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Run on Android emulator with Firebase Auth Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash app/flutter/scripts/android_emulator_e2e.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avijit-sarthi-android-e2e-${{ github.run_id }}
          path: app/flutter/artifacts/
          if-no-files-found: warn
          retention-days: 7
