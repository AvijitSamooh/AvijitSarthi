name: Publish Android to Google Play (Manual)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of a successful Android Release Bundle from master (not run number or artifact ID)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish existing Android artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate build run ID
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::build_run_id must be a numeric GitHub Actions run ID."; exit 1; }

      - name: Verify selected Android build run and AAB artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GH_REPOSITORY"
          if ! RUN_JSON=$(curl --fail --silent \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$API/actions/runs/$BUILD_RUN_ID"); then
            echo "::error::GitHub Actions run ID $BUILD_RUN_ID was not found or is not accessible. Use the run ID from a successful Android Release Bundle run, not an artifact ID, version code, or workflow run number."
            exit 1
          fi
          STATUS=$(jq -r '.status // empty' <<< "$RUN_JSON")
          CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN_JSON")
          WORKFLOW_PATH=$(jq -r '.path // empty' <<< "$RUN_JSON")
          HEAD_BRANCH=$(jq -r '.head_branch // empty' <<< "$RUN_JSON")

          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Selected run $BUILD_RUN_ID is not a completed successful workflow run (status: ${STATUS:-missing}, conclusion: ${CONCLUSION:-missing})."
            exit 1
          fi
          if [ "$WORKFLOW_PATH" != ".github/workflows/android-release.yml" ]; then
            echo "::error::Selected run $BUILD_RUN_ID is not an Android Release Bundle run. Choose a successful run from Android Release Bundle."
            exit 1
          fi
          if [ "$HEAD_BRANCH" != "master" ]; then
            echo "::error::Selected Android Release Bundle run must come from master; run $BUILD_RUN_ID came from ${HEAD_BRANCH:-an unknown branch}."
            exit 1
          fi

          if ! ARTIFACTS=$(curl --fail --silent \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$API/actions/runs/$BUILD_RUN_ID/artifacts"); then
            echo "::error::Unable to list artifacts for Android build run $BUILD_RUN_ID. Check GitHub Actions access and try again."
            exit 1
          fi
          AAB_COUNT=$(jq '[.artifacts[] | select(.expired == false and (.name | startswith("avijit-sahyog-release-aab-")))] | length' <<< "$ARTIFACTS")
          if [ "$AAB_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one unexpired Avijit Sarthi release AAB artifact in run $BUILD_RUN_ID; found $AAB_COUNT."
            exit 1
          fi
          echo "Selected run is a successful Android Release Bundle with one available AAB artifact."

      - name: Download artifact from selected build run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          path: release

      - name: Select and validate App Bundle
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find release -type f -name '*.aab' -print)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .aab artifact from build run ${{ inputs.build_run_id }}; found ${#bundles[@]}."
            find release -maxdepth 4 -type f -print || true
            exit 1
          fi
          mkdir -p publish
          cp "${bundles[0]}" publish/app-release.aab
          test -s publish/app-release.aab
          echo "Selected a single App Bundle from the specified build run."

      - name: Validate Google Play configuration
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_SERVICE_ACCOUNT" || { echo "::error::Missing Actions secret PLAY_STORE_SERVICE_ACCOUNT_JSON."; exit 1; }

      - name: Publish to Google Play internal and closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.avijitsamooh.avijitsahyog
          releaseFiles: publish/app-release.aab
          tracks: internal,alpha
          status: completed
